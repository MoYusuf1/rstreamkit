[package]
name = "rstreamkit"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
repository = "https://github.com/MoYusuf1/rstreamkit"
readme = "README.md"
keywords = ["streaming", "hls", "wasm", "media", "transmux"]
categories = ["multimedia", "wasm", "command-line-utilities"]
license = "MIT OR Apache-2.0"
description = "Pure-Rust streaming toolkit for programs, the command line and the browser: HLS, MPEG-TS, MP4 and Matroska in, fragmented MP4 out, with AC-3, E-AC-3 and MP2 sound decoded in Rust."

[features]
default = ["sound", "vod"]
# AC-3, E-AC-3 and MP2 sound decoded in Rust (about a quarter of a page built from this crate).
# Without it that sound is reported as unsupported, not played.
sound = ["dep:rstreamkit-ac3", "dep:oxideav-core", "dep:oxideav-mp2"]
# Movie files (MP4 and Matroska): `vod`, `mp4`, `mkv` and, in the browser, `mse::probe` and
# `mse::play_movie`.
vod = []

[dependencies]
futures-core = "0.3"
# AC-3 and E-AC-3: oxideav-ac3 0.0.11 by Mark Karpeles (MIT), kept and sped up in ac3/.
rstreamkit-ac3 = { path = "ac3", version = "0.1.0", optional = true }
oxideav-core = { version = "0.1", optional = true }
oxideav-mp2 = { version = "0.0.10", optional = true }
thiserror = "2.0.21"

[[test]]
name = "vod"
required-features = ["vod", "sound"]

[[test]]
name = "vod_without_sound"
required-features = ["vod"]

[[test]]
name = "cli"
required-features = ["vod"]

# The command-line tool: streams and movie files in, fragmented MP4 out.
[[bin]]
name = "rstreamkit"
path = "src/main.rs"
required-features = ["vod"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3.105"
wasm-bindgen = "0.2.128"
wasm-bindgen-futures = "0.4.78"
web-sys = { version = "0.3.105", features = ["AbortController", "AbortSignal", "Window", "Performance", "Document", "Element", "Headers", "HtmlMediaElement", "HtmlVideoElement", "MediaSource", "MediaSourceReadyState", "ReadableStream", "ReadableStreamDefaultReader", "Request", "RequestInit", "Response", "SourceBuffer", "SourceBufferList", "TimeRanges", "Url"] }

[package.metadata.docs.rs]
targets = ["wasm32-unknown-unknown"]
