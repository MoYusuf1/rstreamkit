[package]
name = "rstreamkit"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Pure-Rust streaming toolkit for the browser: HLS, MPEG-TS and movie files in, fragmented MP4 out for MediaSource, with AC-3, E-AC-3 and MP2 sound decoded in Rust."

[dependencies]
futures-core = "0.3"
oxideav-ac3 = "0.0.11"
oxideav-core = "0.1"
oxideav-mp2 = "0.0.10"
thiserror = "2.0.21"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3.105"
wasm-bindgen = "0.2.128"
wasm-bindgen-futures = "0.4.78"
web-sys = { version = "0.3.105", features = ["Window", "Document", "Element", "Headers", "HtmlMediaElement", "HtmlVideoElement", "MediaSource", "MediaSourceReadyState", "ReadableStream", "ReadableStreamDefaultReader", "Request", "RequestInit", "Response", "SourceBuffer", "TimeRanges", "Url"] }
