[package]
name = "rstreamkit-player"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[features]
default = ["sound", "vod"]
sound = ["rstreamkit/sound"]
vod = ["rstreamkit/vod", "dep:wasm-bindgen-futures"]

[dependencies]
rstreamkit = { path = "../..", default-features = false }
wasm-bindgen = "=0.2.128"
wasm-bindgen-futures = { version = "=0.4.78", optional = true }
js-sys = "=0.3.105"
web-sys = { version = "=0.3.105", features = ["Window", "Document", "HtmlVideoElement", "Element"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
