name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        run: |
          rustup update stable
          rustup default stable
          rustup component add rustfmt clippy
          rustup target add wasm32-unknown-unknown
      # The integration tests have ffmpeg decode our output; without it they skip themselves.
      - name: ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      # The library serves any app, so nothing in it may know one (see CONTRIBUTING.md).
      - name: No app names in the library
        run: |
          if grep -rIinE 'riptv|xtream' src tests Cargo.toml; then
            echo "an app name is in the library source"; exit 1
          fi
      - run: cargo fmt --check
      # Every combination of the optional features must lint clean. `mse` only exists on wasm, so
      # nothing else compiles it.
      - name: clippy, native and wasm, in every feature combination
        run: |
          for f in "" "--no-default-features" "--no-default-features --features sound" "--no-default-features --features vod"; do
            cargo clippy --all-targets $f -- -D warnings
            cargo clippy --target wasm32-unknown-unknown $f -- -D warnings
          done
      - run: cargo test
      - run: cargo test --no-default-features
      # Movies without the sound decoders (they are reported as unsupported).
      - run: cargo test --no-default-features --features vod
      # The Dolby decoder kept in ac3/ (from oxideav-ac3, MIT) with its own test suite. Its code keeps
      # its original style, so it is tested here rather than held to this crate's lints.
      - run: cargo test --release --manifest-path ac3/Cargo.toml

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.88.0 --profile minimal --target wasm32-unknown-unknown
      - run: cargo +1.88.0 check --all-features
      - run: cargo +1.88.0 check --no-default-features
      - run: cargo +1.88.0 check --target wasm32-unknown-unknown --all-features
      - run: cargo +1.88.0 check --target wasm32-unknown-unknown --no-default-features

  wasm-audio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add wasm32-unknown-unknown
      - run: rustup component add rustfmt clippy
      - run: cargo fmt --manifest-path tools/player/Cargo.toml --check
      - name: Minimal player feature combinations
        run: |
          for features in "" sound vod sound,vod; do
            cargo clippy --manifest-path tools/player/Cargo.toml --target wasm32-unknown-unknown --no-default-features --features "$features" -- -D warnings
          done
      - run: cargo install wasm-bindgen-cli --version 0.2.128 --locked
      - run: bash tools/build.sh
      - run: node tools/node/audio-smoke.cjs
      - name: Size tools (Binaryen 130)
        run: |
          sudo apt-get update && sudo apt-get install -y brotli
          archive="$RUNNER_TEMP/binaryen.tar.gz"
          curl -fL https://github.com/WebAssembly/binaryen/releases/download/version_130/binaryen-version_130-x86_64-linux.tar.gz -o "$archive"
          echo "0a18362361ad05465118cd8eeb72edaeec89de6894bc283576ef4e07aa3babcc  $archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/binaryen-version_130/bin" >> "$GITHUB_PATH"
      - name: Check all four player download budgets
        run: python3 tools/size.py --check-budgets
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: player-size
          path: tools/results/size.json

  profile:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add wasm32-unknown-unknown
      - run: cargo install wasm-bindgen-cli --version 0.2.128 --locked
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: bash tools/profile.sh > profile.jsonl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wasm-profile
          path: profile.jsonl
